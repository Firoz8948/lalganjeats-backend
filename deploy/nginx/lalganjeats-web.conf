# Angular web apps served from this EC2 box (api.lalganjeats.com is in lalganjeats-api).
# Installed once to /etc/nginx/sites-available/lalganjeats-web; certbot --nginx then
# adds the 443/SSL parts to that installed copy, so edit it there afterwards.

server {
    listen 80;
    server_name www.lalganjeats.com;
    return 301 https://lalganjeats.com$request_uri;
}

server {
    listen 80;
    server_name lalganjeats.com;
    root /var/www/lalganjeats/frontend;
    include snippets/lalganjeats-spa.conf;

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/sitemap.xml;
        proxy_set_header Host api.lalganjeats.com;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/apks/ {
        add_header Content-Disposition attachment;
        add_header Cache-Control "public, max-age=3600";
    }
}

server {
    listen 80;
    server_name live.lalganjeats.com;
    root /var/www/lalganjeats/live-orders;
    include snippets/lalganjeats-spa.conf;
}

server {
    listen 80;
    server_name hotel.lalganjeats.com;
    root /var/www/lalganjeats/hotel-partner-apk;
    include snippets/lalganjeats-spa.conf;
}

server {
    listen 80;
    server_name delivery.lalganjeats.com;
    root /var/www/lalganjeats/delivery-partner-apk;
    include snippets/lalganjeats-spa.conf;
}

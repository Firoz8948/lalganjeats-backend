# Shared settings for the Angular SPAs. Installed to /etc/nginx/snippets/.

index index.html;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

# Angular output files carry an 8-char content hash (main-ABCD1234.js, chunk-..., styles-..., media/...).
location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|png|jpe?g|svg|webp|gif)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
